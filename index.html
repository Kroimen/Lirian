<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lirian</title>
  <link rel="icon" href="/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/extra.css">
</head>
<body>
<script>
(function () {
  function show(msg) {
    var b = document.getElementById('fatal');
    if (!b) {
      b = document.createElement('div');
      b.id = 'fatal';
      b.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:999;background:#b91c1c;color:#fff;padding:10px 14px;font:13px/1.4 system-ui,sans-serif');
      b.onclick = function () { b.remove(); };
      document.documentElement.appendChild(b);
    }
    b.textContent = 'Ошибка на странице: ' + msg + ' (нажмите, чтобы скрыть)';
  }
  window.addEventListener('error', function (e) { show(e.message + (e.lineno ? ' [строка ' + e.lineno + ']' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show(String((e.reason && e.reason.message) || e.reason)); });
})();
</script>

<div id="auth">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/logo.jpg" alt="Lirian">
      <div class="logo-text">Lirian</div>
    </div>
    <div id="stepEmail" class="field"><input id="email" type="email" inputmode="email" placeholder="Твоя почта" autocomplete="email" autocapitalize="none"></div>
    <div id="stepCode" class="hidden">
      <div class="auth-hint" id="codeHint"></div>
      <div class="field"><input id="code" inputmode="numeric" maxlength="8" placeholder="Код из письма" autocomplete="one-time-code"></div>
      <div id="nameField" class="field hidden"><input id="newName" placeholder="Придумай имя (3–20 символов)" autocapitalize="none"></div>
    </div>
    <div id="err"></div>
    <div class="auth-btns">
      <button id="getCode" class="primary">Получить код</button>
      <button id="verify" class="primary hidden">Войти</button>
      <button id="backBtn" class="hidden">Назад</button>
    </div>
    <button id="resend" class="linkbtn hidden" type="button">Отправить код ещё раз</button>
    <div class="ver" id="ver">версия 12 · скрипт не запущен</div>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark"><img src="/logo.jpg" alt="Lirian"></div>
        <div class="logo-text">Lirian</div>
      </div>
      <div class="head-btns"><button class="icon-btn" id="newGroup" title="Новая группа">👥</button><button class="icon-btn" id="menu" title="Профиль"></button></div>
    </div>
    <div class="search-wrap">
      <div class="search">
        <span class="search-icon">⌕</span>
        <input type="text" id="search" placeholder="Поиск контактов">
      </div>
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="main">
    <div class="placeholder" id="placeholder">
      <img src="/logo.jpg" alt="">
      <div>Выберите чат, чтобы начать переписку</div>
    </div>

    <div id="chatView" class="hidden">
      <div class="chat-header">
        <button class="icon-btn back-btn" id="back" aria-label="Назад">←</button>
        <div id="headAvatar"></div>
        <div class="header-info">
          <div class="header-name" id="headName"></div>
          <div class="header-status" id="headStatus"></div>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <button class="tool-btn" id="attach" type="button" title="Фото">＋</button>
        <input type="file" id="photoFile" accept="image/*" multiple class="hidden">
        <div class="input-box">
          <textarea id="text" rows="1" placeholder="Написать сообщение..."></textarea>
        </div>
        <button class="send-btn" id="send" type="button">➤</button>
      </div>
    </div>
  </main>
</div>

<div id="lightbox" class="hidden"><img id="lightImg" alt=""></div>

<div id="pickModal" class="modal hidden">
  <div class="modal-card">
    <div class="prof-name" id="pickTitle"></div>
    <div id="nameWrap" class="field" style="width:100%"><input id="groupName" placeholder="Название группы" maxlength="40"></div>
    <div id="pickList" class="pick-list"></div>
    <div id="pickErr" class="prof-err"></div>
    <button id="pickOk" type="button" class="pbtn primary">Готово</button>
    <button id="pickCancel" type="button" class="pbtn ghost">Отмена</button>
  </div>
</div>

<div id="groupModal" class="modal hidden">
  <div class="modal-card">
    <div class="prof-name" id="gName"></div>
    <div class="pick-list" id="gMembers"></div>
    <div id="gErr" class="prof-err"></div>
    <button id="gAdd" type="button" class="pbtn primary">Добавить участников</button>
    <button id="gRename" type="button" class="pbtn">Переименовать</button>
    <button id="gLeave" type="button" class="pbtn danger">Выйти из группы</button>
    <button id="gClose" type="button" class="pbtn ghost">Закрыть</button>
  </div>
</div>

<div id="wallModal" class="modal hidden">
  <div class="modal-card wall-card">
    <div class="prof-name">Обои чата</div>
    <div id="wallGrid" class="wall-grid"></div>
    <input type="file" id="wallFile" accept="image/*" class="hidden">
    <div id="wallErr" class="prof-err"></div>
    <button id="closeWall" type="button" class="pbtn primary">Готово</button>
  </div>
</div>

<div id="profile" class="modal hidden">
  <div class="modal-card">
    <div id="profAvatar" class="prof-avatar"></div>
    <div class="prof-name" id="profName"></div>
    <input type="file" id="file" accept="image/*" class="hidden">
    <div class="prof-btns">
      <button id="pickPhoto" type="button" class="pbtn primary">Выбрать фото</button>
      <button id="removePhoto" type="button" class="pbtn">Убрать фото</button>
    </div>
    <div id="profErr" class="prof-err"></div>
    <button id="openWall" type="button" class="pbtn">Обои чата</button>
    <button id="logoutAll" type="button" class="pbtn">Выйти на всех устройствах</button>
    <button id="logoutBtn" type="button" class="pbtn danger">Выйти из аккаунта</button>
    <button id="closeProfile" type="button" class="pbtn ghost">Закрыть</button>
  </div>
</div>

<script src="/photos.js"></script>
<script src="/wallpapers.js"></script>
<script src="/security.js"></script>
<script src="/auth.js"></script>
<script src="/groups.js"></script>
<script src="/app.js"></script>
</body>
</html>
