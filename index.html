<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lirian</title>
  <link rel="icon" href="/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #5d33b0;
      --primary-glow: #7b4fd4;
      --primary-bright: #9b6dff;
      --primary-dim: #3d2280;
      --bg: #07060e;
      --panel: rgba(18, 14, 32, 0.85);
      --panel-solid: #100e1a;
      --surface: rgba(28, 22, 48, 0.6);
      --border: rgba(93, 51, 176, 0.25);
      --border-bright: rgba(155, 109, 255, 0.45);
      --text: #e8e4f5;
      --text-muted: #8a82a8;
      --text-dim: #5c5578;
      --online: #00f0a0;
      --online-glow: rgba(0, 240, 160, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(rgba(93, 51, 176, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(93, 51, 176, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(93, 51, 176, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .sidebar {
      width: 320px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .sidebar-header {
      padding: 18px 16px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 16px rgba(220, 40, 60, 0.45);
      flex-shrink: 0;
      border: 1px solid rgba(255, 80, 100, 0.3);
    }

    .logo-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #fff, var(--primary-bright));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      border-color: var(--border-bright);
      color: var(--primary-bright);
      box-shadow: 0 0 12px rgba(93, 51, 176, 0.25);
    }

    .search-wrap {
      padding: 12px 14px;
    }

    .search {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .search:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(93, 51, 176, 0.15), 0 0 20px rgba(93, 51, 176, 0.1);
    }

    .search input {
      border: none;
      background: transparent;
      outline: none;
      color: var(--text);
      font-size: 13.5px;
      width: 100%;
      font-family: inherit;
    }

    .search input::placeholder {
      color: var(--text-dim);
    }

    .search-icon {
      color: var(--text-dim);
      font-size: 14px;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
    }

    .chat-list::-webkit-scrollbar {
      width: 3px;
    }

    .chat-list::-webkit-scrollbar-thumb {
      background: var(--primary-dim);
      border-radius: 3px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s;
      margin-bottom: 2px;
      border: 1px solid transparent;
      position: relative;
    }

    .chat-item:hover {
      background: var(--surface);
      border-color: var(--border);
    }

    .chat-item.active {
      background: linear-gradient(90deg, rgba(93, 51, 176, 0.22), rgba(93, 51, 176, 0.08));
      border-color: var(--border-bright);
      box-shadow: inset 0 0 20px rgba(93, 51, 176, 0.08);
    }

    .chat-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      background: var(--primary-bright);
      border-radius: 0 3px 3px 0;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .avatar .status {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background: var(--online);
      border: 2px solid var(--panel-solid);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--online-glow);
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 3px;
    }

    .chat-name {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    .chat-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-preview {
      font-size: 12.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 185px;
    }

    .chat-preview .you {
      color: var(--primary-bright);
      font-weight: 500;
    }

    .badge {
      background: linear-gradient(135deg, var(--primary), var(--primary-glow));
      color: white;
      font-size: 11px;
      font-weight: 600;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      box-shadow: 0 0 10px rgba(93, 51, 176, 0.4);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 5;
      background: rgba(10, 8, 18, 0.6);
    }

    .chat-header {
      padding: 12px 20px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      height: 68px;
    }

    .chat-header .avatar {
      width: 40px;
      height: 40px;
      font-size: 14px;
      border-radius: 12px;
    }

    .header-info {
      flex: 1;
    }

    .header-name {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.2px;
    }

    .header-status {
      font-size: 12px;
      color: var(--online);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 1px;
    }

    .header-status::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--online);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--online-glow);
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--primary-dim);
      border-radius: 4px;
    }

    .date-pill {
      align-self: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11.5px;
      padding: 5px 14px;
      border-radius: 20px;
      margin: 8px 0 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .message {
      display: flex;
      max-width: 62%;
      animation: msgIn 0.25s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message.out {
      align-self: flex-end;
    }

    .message.in {
      align-self: flex-start;
    }

    .bubble {
      padding: 11px 15px 8px;
      position: relative;
      line-height: 1.45;
      font-size: 14px;
      border: 1px solid transparent;
    }

    .message.out .bubble {
      background: linear-gradient(135deg, rgba(93, 51, 176, 0.85), rgba(74, 40, 144, 0.9));
      border-color: rgba(155, 109, 255, 0.3);
      border-radius: 16px 16px 4px 16px;
      color: white;
      box-shadow: 0 4px 20px rgba(93, 51, 176, 0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .message.in .bubble {
      background: var(--surface);
      border-color: var(--border);
      border-radius: 16px 16px 16px 4px;
      backdrop-filter: blur(8px);
    }

    .bubble-text {
      margin-bottom: 4px;
      word-break: break-word;
    }

    .bubble-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      font-size: 11px;
      opacity: 0.7;
    }

    .message.out .bubble-meta {
      color: rgba(255,255,255,0.75);
    }

    .message.in .bubble-meta {
      color: var(--text-dim);
    }

    .checks {
      font-size: 12px;
      letter-spacing: -1px;
    }

    .input-area {
      padding: 14px 18px 18px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .tool-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .tool-btn:hover {
      border-color: var(--border-bright);
      color: var(--primary-bright);
      box-shadow: 0 0 14px rgba(93, 51, 176, 0.2);
    }

    .input-box {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      min-height: 42px;
      transition: all 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(93, 51, 176, 0.15), 0 0 24px rgba(93, 51, 176, 0.1);
    }

    .input-box textarea {
      border: none;
      background: transparent;
      outline: none;
      color: var(--text);
      font-size: 14px;
      width: 100%;
      resize: none;
      max-height: 110px;
      font-family: inherit;
      line-height: 1.4;
    }

    .input-box textarea::placeholder {
      color: var(--text-dim);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-glow));
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 0 0 18px rgba(93, 51, 176, 0.4);
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 28px rgba(93, 51, 176, 0.55);
    }

    /* ---- дополнения к макету ---- */
    html { height: 100%; }
    body { height: 100vh; height: 100dvh; }
    .hidden { display: none !important; }
    #app { display: flex; flex: 1; min-width: 0; height: 100%; }
    .back-btn { display: none; }
    .header-status.off { color: var(--text-dim); }
    .header-status.off::before { background: var(--text-dim); box-shadow: none; }
    .chat-preview { max-width: 100%; }
    .chat-bottom { gap: 8px; }
    .list-empty { padding: 24px 12px; color: var(--text-dim); font-size: 13px; text-align: center; }
    .placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text-dim); font-size: 14px; }
    .placeholder img { width: 120px; height: 120px; border-radius: 50%; opacity: 0.85; box-shadow: 0 0 40px rgba(220, 40, 60, 0.35); }
    #chatView { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    #auth { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 28px 24px; backdrop-filter: blur(20px); box-shadow: 0 0 60px rgba(93, 51, 176, 0.18); }
    .auth-logo { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 22px; }
    .auth-logo img { width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 0 28px rgba(220, 40, 60, 0.45); border: 1px solid rgba(255, 80, 100, 0.3); }
    .auth-logo .logo-text { font-size: 22px; letter-spacing: 3px; }
    .field { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; transition: all 0.2s; }
    .field:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(93, 51, 176, 0.15); }
    .field input { border: none; background: transparent; outline: none; color: var(--text); font: inherit; font-size: 14px; width: 100%; }
    .field input::placeholder { color: var(--text-dim); }
    #err { color: #fb7185; font-size: 13px; min-height: 18px; margin: 2px 2px 10px; }
    .auth-btns { display: flex; gap: 8px; }
    .auth-btns button { flex: 1; padding: 12px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all 0.2s; }
    .auth-btns button:hover { border-color: var(--border-bright); }
    .ver { margin-top: 16px; text-align: center; font-size: 11px; color: var(--text-dim); }
    .auth-btns button:disabled { opacity: 0.6; cursor: default; }
    .auth-btns button.primary { border: none; background: linear-gradient(135deg, var(--primary), var(--primary-glow)); color: #fff; box-shadow: 0 0 18px rgba(93, 51, 176, 0.4); }

    @media (max-width: 760px) {
      .sidebar { width: 100%; border-right: none; }
      .main { display: none; width: 100%; }
      #app.in-chat .sidebar { display: none; }
      #app.in-chat .main { display: flex; }
      .back-btn { display: flex; }
      .chat-header { padding: 12px 14px; gap: 10px; }
      .messages { padding: 16px 14px; }
      .message { max-width: 88%; }
      .input-area { padding: 10px 12px 12px; }
      .input-area .tool-btn { display: none; }
    }
  </style>
</head>
<body>
<script>
(function () {
  function show(msg) {
    var b = document.getElementById('fatal');
    if (!b) {
      b = document.createElement('div');
      b.id = 'fatal';
      b.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:999;background:#b91c1c;color:#fff;padding:10px 14px;font:13px/1.4 system-ui,sans-serif');
      b.onclick = function () { b.remove(); };
      document.documentElement.appendChild(b);
    }
    b.textContent = 'Ошибка на странице: ' + msg + ' (нажмите, чтобы скрыть)';
  }
  window.addEventListener('error', function (e) { show(e.message + (e.lineno ? ' [строка ' + e.lineno + ']' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show(String((e.reason && e.reason.message) || e.reason)); });
})();
</script>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark"><img src="/logo.jpg" alt="Lirian"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* ничего */ } },
  clear() { try { localStorage.clear(); } catch { /* ничего */ } },
};
let token = store.get('token');
let me = null;
try { me = JSON.parse(store.get('me') || 'null'); } catch { me = null; }
let socket = null, peer = null, users = [], lastDay = '';
const unread = new Map();   // id собеседника -> число непрочитанных
const online = new Set();   // id пользователей в сети

const GRADS = [['#5d33b0', '#9b6dff'], ['#e11d48', '#fb7185'], ['#0891b2',
