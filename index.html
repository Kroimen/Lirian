<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мессенджер</title>
<style>
  :root {
    --bg: #f1f3f6; --panel: #fff; --text: #1b2430; --muted: #6b7684;
    --line: #e1e5ea; --accent: #2563eb; --mine: #dbe8ff; --theirs: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --panel: #1a2029; --text: #e6e9ee; --muted: #8b95a3;
      --line: #28303b; --accent: #5b8def; --mine: #243a63; --theirs: #262e39;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  #auth { max-width: 320px; margin: 15vh auto; padding: 24px; background: var(--panel); border-radius: 12px; }
  #auth h1 { margin: 0 0 16px; font-size: 22px; }
  #auth input { display: block; width: 100%; margin-bottom: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
  #auth .row { display: flex; gap: 8px; }
  #auth button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; }
  #auth button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #err { color: #d33; min-height: 1.4em; margin: 0 0 8px; font-size: 14px; }

  #app { display: flex; height: 100%; }
  #side { width: 300px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #side header, #chat header { padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  #side header button { border: 0; background: none; color: var(--muted); font-size: 14px; }
  #users { overflow-y: auto; flex: 1; }
  .user { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; }
  .user.active { background: var(--bg); }
  .user .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); align-self: center; }

  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #back { display: none; border: 0; background: none; font-size: 20px; margin-right: 8px; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 14px; background: var(--theirs); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.mine { align-self: flex-end; background: var(--mine); }
  .msg time { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  #empty { margin: auto; color: var(--muted); }
  #form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #text { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 20px; background: transparent; }
  #form button { padding: 0 18px; border: 0; border-radius: 20px; background: var(--accent); color: #fff; }

  @media (max-width: 700px) {
    #side { width: 100%; }
    #chat { display: none; }
    #app.in-chat #side { display: none; }
    #app.in-chat #chat { display: flex; }
    #back { display: inline-block; }
  }
</style>
</head>
<body>

<div id="auth">
  <h1>Мессенджер</h1>
  <input id="username" placeholder="Имя пользователя" autocomplete="username">
  <input id="password" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
  <p id="err"></p>
  <div class="row">
    <button id="login" class="primary">Войти</button>
    <button id="register">Создать аккаунт</button>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="side">
    <header><span id="me"></span><button id="logout">Выйти</button></header>
    <div id="users"></div>
  </aside>
  <section id="chat">
    <header><button id="back" aria-label="Назад">←</button><span id="peerName">Выберите чат</span></header>
    <div id="msgs"><div id="empty">Выберите собеседника слева</div></div>
    <form id="form" class="hidden">
      <input id="text" placeholder="Сообщение" autocomplete="off">
      <button>Отправить</button>
    </form>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('token');
let me = JSON.parse(localStorage.getItem('me') || 'null');
let peer = null, socket = null;
const unread = new Set();

async function api(path, opts = {}) {
  const r = await fetch('/api/' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Ошибка');
  return data;
}

async function authenticate(kind) {
  try {
    const data = await api(kind, { method: 'POST', body: { username: $('username').value.trim(), password: $('password').value } });
    token = data.token; me = data.user;
    localStorage.setItem('token', token);
    localStorage.setItem('me', JSON.stringify(me));
    start();
  } catch (e) { $('err').textContent = e.message; }
}
$('login').onclick = () => authenticate('login');
$('register').onclick = () => authenticate('register');
$('logout').onclick = () => { localStorage.clear(); location.reload(); };

async function start() {
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('me').textContent = me.username;
  socket = io({ auth: { token } });
  socket.on('connect_error', () => $('logout').click());
  socket.on('message', onMessage);
  await loadUsers();
}

async function loadUsers() {
  const users = await api('users');
  const box = $('users');
  box.innerHTML = '';
  users.forEach((u) => {
    const row = document.createElement('div');
    row.className = 'user' + (peer && peer.id === u.id ? ' active' : '');
    const name = document.createElement('span');
    name.textContent = u.username;
    row.append(name);
    if (unread.has(u.id)) { const d = document.createElement('i'); d.className = 'dot'; row.append(d); }
    row.onclick = () => openChat(u);
    box.append(row);
  });
  window._users = users;
}

async function openChat(u) {
  peer = u;
  unread.delete(u.id);
  $('peerName').textContent = u.username;
  $('form').classList.remove('hidden');
  $('app').classList.add('in-chat');
  $('msgs').innerHTML = '';
  (await api('messages/' + u.id)).forEach(addMessage);
  $('text').focus();
  loadUsers();
}

function addMessage(m) {
  const el = document.createElement('div');
  el.className = 'msg' + (m.from_id === me.id ? ' mine' : '');
  const t = document.createElement('span');
  t.textContent = m.text;
  const time = document.createElement('time');
  time.textContent = new Date(m.created_at.replace(' ', 'T') + 'Z').toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  el.append(t, time);
  const box = $('msgs');
  box.append(el);
  box.scrollTop = box.scrollHeight;
}

function onMessage(m) {
  const other = m.from_id === me.id ? m.to_id : m.from_id;
  if (peer && peer.id === other) addMessage(m);
  else { unread.add(other); loadUsers(); }
}

$('form').onsubmit = (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || !peer) return;
  socket.emit('message', { to: peer.id, text });
  $('text').value = '';
};
$('back').onclick = () => $('app').classList.remove('in-chat');

if (token && me) start();
</script>
</body>
</html>
